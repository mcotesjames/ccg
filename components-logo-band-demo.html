<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo band demo: CCG components</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles/system.css">
  <link rel="stylesheet" href="styles/components.css">

  <style>
    /* the band is the whole demo: hold it in the middle of the
       frame so the switch between widths reads clearly */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-content: center;
      background: #fff;
    }
  </style>
</head>

<body>

  <section class="logo-band" aria-label="Demo group companies">
    <div class="logo-band-track">
      <div class="logo-band-set">
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
      </div>

      <div class="logo-band-set" aria-hidden="true">
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
        <div class="logo-band-mark"><img src="images/union-mark.svg" alt=""></div>
      </div>
    </div>
  </section>

</body>
</html>
